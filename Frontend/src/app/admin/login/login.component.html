<div class="login-page">

  <section class="login-card">

    <div class="login-brand">

      <div class="logo-box">
        <!-- Logo em Frontend/public/TimDoLeleLogo.png; sem o arquivo, mostra o ícone -->
        @if (!logoComErro) {
          <img src="TimDoLeleLogo.png" alt="Logo" (error)="logoComErro = true" />
        } @else {
          🍔
        }
      </div>

      <!-- A logo já tem o nome; o texto só aparece se ela não carregar -->
      @if (logoComErro) {
        <h1>
          TIM DO LELÊ
        </h1>

        <strong>
          LANCHES
        </strong>
      }

      <p>
        Acesso exclusivo ao painel administrativo
      </p>

    </div>


    <form
      class="login-form"
      (ngSubmit)="login()"
    >

      <label>

        E-mail

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
          autocomplete="username"
          required
        />

      </label>


      <label>

        Senha

        <input
          type="password"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        />

      </label>


      <button
        type="submit"
        class="login-button"
        [disabled]="carregando"
      >

        {{
          carregando
            ? 'ENTRANDO...'
            : 'ENTRAR'
        }}

      </button>


      <button
        type="button"
        class="forgot-button"
      >
        Esqueceu sua senha?
      </button>

    </form>

  </section>

</div>
