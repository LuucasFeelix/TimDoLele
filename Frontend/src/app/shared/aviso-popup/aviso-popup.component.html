@if (avisoService.atual(); as aviso) {

  <div
    class="aviso-overlay"
    (click)="cancelar()"
  >

    <div
      class="aviso-modal"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="aviso.titulo"
      (click)="$event.stopPropagation()"
    >

      <div
        class="aviso-icone"
        [ngClass]="aviso.tipo"
      >
        {{ icones[aviso.tipo] }}
      </div>

      <h2 [ngClass]="aviso.tipo">
        {{ aviso.titulo }}
      </h2>

      <p class="aviso-mensagem">
        {{ aviso.mensagem }}
      </p>

      <!-- Pergunta com motivo: opções prontas + "Outro" -->
      @if (aviso.motivos?.length) {
        <div class="aviso-motivos">
          @for (motivo of aviso.motivos; track motivo) {
            <button
              type="button"
              class="aviso-motivo"
              [class.escolhido]="motivoEscolhido === motivo"
              (click)="escolherMotivo(motivo)"
            >
              {{ motivo }}
            </button>
          }

          <button
            type="button"
            class="aviso-motivo"
            [class.escolhido]="motivoEscolhido === 'Outro'"
            (click)="escolherMotivo('Outro')"
          >
            Outro
          </button>
        </div>

        @if (motivoEscolhido === 'Outro') {
          <textarea
            id="aviso-outro-motivo"
            class="aviso-outro"
            rows="2"
            maxlength="200"
            placeholder="Escreva o motivo"
            semEmoji
            [value]="outroMotivo"
            (input)="aoDigitarOutro($event)"
          ></textarea>
        }
      }

      <div class="aviso-botoes">

        @if (aviso.confirmacao) {
          <button
            type="button"
            class="aviso-cancelar"
            (click)="cancelar()"
          >
            {{ aviso.textoCancelar }}
          </button>
        }

        <button
          type="button"
          class="aviso-confirmar"
          [class.perigo]="aviso.perigo"
          [disabled]="pedeMotivo && !motivoFinal"
          (click)="confirmar()"
        >
          {{ aviso.textoConfirmar }}
        </button>

      </div>

    </div>

  </div>

}
