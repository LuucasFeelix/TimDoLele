<div class="confirmacao-page">

  <div class="confirmacao-card card">

    <div class="success-icon">
      ✅
    </div>

    <h1>Pedido enviado com sucesso!</h1>

    <p>
      Seu pedido foi recebido e em breve será preparado.
    </p>

    <div
      *ngIf="pedido?.codigo"
      class="info-box"
    >
      <span>Número do pedido</span>
      <strong>#{{ pedido.codigo }}</strong>
    </div>

    <div
      *ngIf="prazo"
      class="info-box"
    >
      <span>
        {{ ehRetirada ? 'Previsão para retirada' : 'Previsão de entrega' }}
      </span>
      <strong>{{ prazo }}</strong>
      <small *ngIf="ehRetirada">
        Retire seu pedido no balcão da loja
      </small>
    </div>

    <div class="info-box">
      <span>Total</span>
      <strong>{{ pedido?.total | dinheiro }}</strong>
    </div>

    <button
      *ngIf="whatsAppLoja"
      class="whatsapp-button"
      (click)="falarWhatsapp()"
    >
      💬 Falar no WhatsApp
    </button>

    <button
      class="secondary-button voltar-button"
      (click)="voltarCardapio()"
    >
      Voltar para o cardápio
    </button>

  </div>

</div>
